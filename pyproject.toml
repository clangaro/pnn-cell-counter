[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnn-cell-counter"
version = "0.1.0"
description = "Detection of PV+ cells with and without perineuronal nets in confocal sections using tiled YOLOv8."
authors = [{name = "Carolina Langaro"}]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.12.0.*",
    "pillow==10.4.0",
    "ultralytics==8.4.115",
]

[project.optional-dependencies]
czi = ["aicspylibczi"]

[project.scripts]
pnn-count-tiles = "pnn_counter.count_tiles:main"

[tool.setuptools]
packages = ["pnn_counter"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "single"
